# _pkgdown.yml - Updated to match existing vignettes
url: https://Mayooran1987.github.io/dilutionrisk/

template:
  bootstrap: 5

navbar:
  type: default
  left:
    - text: "Home"
      icon: "fa-home"
      href: "index.html"
    - text: "Reference"
      icon: "fa-file-alt"
      href: "reference/index.html"
    - text: "Articles"
      icon: "fa-book"
      menu:
        - text: "Introduction"
          href: "articles/introduction.html"
        - text: "Homogeneous Batch Models"
          href: "articles/homogeneous_models.html"
        - text: "Heterogeneous Batch Models"
          href: "articles/heterogeneous_models.html"
        - text: "Validation and Simulation"
          href: "articles/validation.html"
    - text: "News"
      icon: "fa-newspaper"
      href: "news/index.html"
  right:
    - text: "GitHub"
      icon: "fa-github"
      href: "https://github.com/Mayooran1987/dilutionrisk"

reference:
  - title: "Probability Detection Functions"
    desc: "Calculate probability of detection for homogeneous and heterogeneous batches"
    contents:
      - prob_detection_homogeneous
      - prob_detection_homogeneous_multiple
      - prob_detection_heterogeneous
      - prob_detection_heterogeneous_multiple

  - title: "Probability Acceptance Functions"
    desc: "Calculate probability of acceptance for sampling plans"
    contents:
      - prob_acceptance_homogeneous
      - prob_acceptance_homogeneous_multiple
      - prob_acceptance_heterogeneous
      - prob_acceptance_heterogeneous_multiple

  - title: "Operating Characteristic (OC) Curves"
    desc: "Generate OC curves for comparing dilution schemes"
    contents:
      - OC_curves_homogeneous
      - OC_curves_heterogeneous

  - title: "Probability of Detection (PD) Curves"
    desc: "Generate PD curves for comparing dilution schemes"
    contents:
      - pd_curves_homogeneous
      - pd_curves_heterogeneous

  - title: "Coefficient of Variation (CV)"
    desc: "Estimate CV for different dilution schemes"
    contents:
      - cv_homogeneous
      - cv_homogeneous_multiple
      - cv_heterogeneous
      - cv_heterogeneous_multiple
      - cv_curves_homogeneous
      - cv_curves_heterogeneous

  - title: "True Concentration Estimation"
    desc: "Estimate true microbial concentration in original samples"
    contents:
      - true_concentration_homogeneous
      - true_concentration_homogeneous_multiple
      - true_concentration_heterogeneous
      - true_concentration_heterogeneous_multiple
      - true_concentration_curves_homogeneous
      - true_concentration_curves_heterogeneous

  - title: "Validation Functions"
    desc: "Validate theoretical results with simulations"
    contents:
      - pd_validation_homogeneous
      - pd_validation_heterogeneous

  - title: "Distribution Functions"
    desc: "Random number generation from truncated distributions"
    contents:
      - rtrunpoilog

