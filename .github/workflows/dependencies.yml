# Workflow to check dependencies

name: dependencies

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  check-deps:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Check dependencies
        run: |
          Rscript -e 'install.packages(c("devtools", "remotes"))'
          Rscript -e '
            deps <- devtools::dev_package_deps()
            if (nrow(deps) > 0) {
              cat("Package dependencies:\n")
              print(deps)
              
              # Check for outdated dependencies
              outdated <- remotes::package_deps(deps$package)
              outdated <- outdated[outdated$package != "R", ]
              if (nrow(outdated) > 0) {
                cat("\nOutdated dependencies:\n")
                print(outdated)
              }
            }
          '