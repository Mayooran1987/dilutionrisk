# Workflow to update README badges

name: badges

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  badges:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Update badges
        run: |
          Rscript -e 'install.packages("badger")'
          Rscript -e '
            library(badger)
            # This would update badges in README if you have a template
            # For now, we just check the package
            devtools::check()
          '