# _pkgdown.yml
url: https://mayooran1987.github.io/dilutionrisk/

template:
  bootstrap: 5

reference:
- title: "Random Number Generation"
  desc: "Functions for generating random numbers from truncated distributions"
  contents:
  - rtpois
  - rtrunpoilog

- title: "Coefficient of Variation"
  desc: "Estimate coefficient of variation for homogeneous and heterogeneous batches"
  contents:
  - cv_homogeneous
  - cv_homogeneous_multiple
  - cv_curves_homogeneous
  - cv_heterogeneous
  - cv_heterogeneous_multiple
  - cv_curves_heterogeneous

- title: "Probability of Detection"
  desc: "Calculate probability of detection for microbial contamination"
  contents:
  - prob_detection_homogeneous
  - prob_detection_homogeneous_multiple
  - prob_detection_heterogeneous
  - prob_detection_heterogeneous_multiple

- title: "Probability of Acceptance"
  desc: "Calculate probability of acceptance for sampling plans"
  contents:
  - prob_acceptance_homogeneous
  - prob_acceptance_homogeneous_multiple
  - prob_acceptance_heterogeneous
  - prob_acceptance_heterogeneous_multiple

- title: "Operating Characteristic Curves"
  desc: "Generate operating characteristic curves for dilution schemes"
  contents:
  - OC_curves_homogeneous
  - OC_curves_heterogeneous

- title: "Probability of Detection Curves"
  desc: "Generate probability of detection curves for dilution schemes"
  contents:
  - pd_curves_homogeneous
  - pd_curves_heterogeneous

- title: "True Concentration Estimation"
  desc: "Estimate true microbial concentration from diluted samples"
  contents:
  - true_concentration_homogeneous
  - true_concentration_homogeneous_multiple
  - true_concentration_curves_homogeneous
  - true_concentration_heterogeneous
  - true_concentration_heterogeneous_multiple
  - true_concentration_curves_heterogeneous

- title: "Validation Tools"
  desc: "Compare theoretical and simulation-based results"
  contents:
  - pd_validation_homogeneous
  - pd_validation_heterogeneous

- title: "Helper Functions"
  desc: "Utility functions for sensitivity analysis and comparison"
  contents:
  - compare_cv_heterogeneous
  - plot_cv_comparison
